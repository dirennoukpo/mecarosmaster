# ─────────────────────────────────────────────────────────────────────────────
#  mecarosmaster_controllers.yaml
#  Paramètres des controllers ros2_control pour Mecarosmaster (ROS 2 Humble)
# ─────────────────────────────────────────────────────────────────────────────

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz — doit correspondre à publish_rate du hardware

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

# ─────────────────────────────────────────────────────────────────────────────
joint_state_broadcaster:
  ros__parameters: {}   # publie toutes les interfaces disponibles

# ─────────────────────────────────────────────────────────────────────────────
#  mecanum_drive_controller — ROS 2 Humble
#
#  CORRECTION CRITIQUE : le controller Humble attend les noms de joints
#  via les clés  *_wheel_command_joint_name  (singulier, sans "s").
#  Les clés  front_left_wheel_name / front_right_wheel_name  appartiennent
#  à l'ancienne API (Galactic) et sont ignorées en Humble → paramètre vide
#  → exception "cannot be empty".
# ─────────────────────────────────────────────────────────────────────────────
mecanum_drive_controller:
  ros__parameters:
    # ── Noms des joints (doivent correspondre exactement à l'URDF) ────────────
    front_left_wheel_command_joint_name:  wheel_fl_joint
    front_right_wheel_command_joint_name: wheel_fr_joint
    rear_left_wheel_command_joint_name:   wheel_rl_joint
    rear_right_wheel_command_joint_name:  wheel_rr_joint

    front_left_wheel_state_joint_name:    wheel_fl_joint
    front_right_wheel_state_joint_name:   wheel_fr_joint
    rear_left_wheel_state_joint_name:     wheel_rl_joint
    rear_right_wheel_state_joint_name:    wheel_rr_joint

    # ── Géométrie du robot (mètres) ───────────────────────────────────────────
    wheel_radius:                 0.045   # rayon roue
    wheel_separation_x:           0.28   # empattement avant-arrière (axe X)
    wheel_separation_y:           0.24   # voie gauche-droite       (axe Y)

    # ── Topics I/O ────────────────────────────────────────────────────────────
    reference_topic:              "cmd_vel"
    odom_topic:                   "odom"
    tf_frame_prefix_enable:       false

    # ── Odométrie ─────────────────────────────────────────────────────────────
    open_loop:                    false
    enable_odom_tf:               true
    odom_frame_id:                "odom"
    base_frame_id:                "base_link"
    pose_covariance_diagonal:     [0.01,  0.01,  1.0e6, 1.0e6, 1.0e6, 0.01]
    twist_covariance_diagonal:    [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.001]

    # ── Limites de vitesse ────────────────────────────────────────────────────
    linear.x.has_velocity_limits:   true
    linear.x.max_velocity:          0.5     # m/s
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration:      1.0     # m/s²

    linear.y.has_velocity_limits:   true
    linear.y.max_velocity:          0.5
    linear.y.has_acceleration_limits: true
    linear.y.max_acceleration:      1.0

    angular.z.has_velocity_limits:  true
    angular.z.max_velocity:         2.0     # rad/s
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:     4.0     # rad/s²

    # ── Publish rate (doit être ≤ update_rate du controller_manager) ──────────
    publish_rate: 50.0

