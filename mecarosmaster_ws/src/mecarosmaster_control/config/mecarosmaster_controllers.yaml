controller_manager:
  ros__parameters:
    update_rate: 50
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

mecanum_drive_controller:
  ros__parameters:
    front_left_wheel_name:  wheel_fl_joint
    front_right_wheel_name: wheel_fr_joint
    rear_left_wheel_name:   wheel_rl_joint
    rear_right_wheel_name:  wheel_rr_joint
    wheel_radius:           0.045
    wheel_separation_x:     0.28
    wheel_separation_y:     0.24
    linear.x.max_velocity:  0.5
    linear.y.max_velocity:  0.5
    angular.z.max_velocity: 2.0
    enable_odom_tf:         true
    odom_frame_id:          odom
    base_frame_id:          base_link
    open_loop:              false
