# ─────────────────────────────────────────────────────────────────────────────
#  mecarosmaster_controllers.yaml  —  ROS 2 Humble
#
#  Rosmaster X3 avec roues à crampons (non mecanum)
#  → diff_drive_controller : 4 roues groupées 2 à 2 (char d'assaut)
#     left  = front_left_joint  + back_left_joint
#     right = front_right_joint + back_right_joint
#
#  Géométrie Yahboom X3 (depuis URDF) :
#    wheel_radius    = 0.045 m
#    wheel_separation = 0.084492 + 0.0845 ≈ 0.169 m (voie totale)
# ─────────────────────────────────────────────────────────────────────────────

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

# ─────────────────────────────────────────────────────────────────────────────
joint_state_broadcaster:
  ros__parameters: {}

# ─────────────────────────────────────────────────────────────────────────────
diff_drive_controller:
  ros__parameters:

    # ── Joints ───────────────────────────────────────────────────────────────
    # left_wheel_names  : les deux roues gauches (FL + RL)
    # right_wheel_names : les deux roues droites (FR + RR)
    left_wheel_names:
      - front_left_joint
      - back_left_joint
    right_wheel_names:
      - front_right_joint
      - back_right_joint

    # ── Géométrie ─────────────────────────────────────────────────────────────
    wheel_radius:      0.045   # [m]
    wheel_separation:  0.169   # [m]  distance entre centre roue gauche et droite

    # ── Odométrie ─────────────────────────────────────────────────────────────
    open_loop:          false
    enable_odom_tf:     true
    odom_frame_id:      "odom"
    base_frame_id:      "base_link"

    pose_covariance_diagonal:  [0.01, 0.01, 1.0e6, 1.0e6, 1.0e6, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.001]

    # ── Limites ───────────────────────────────────────────────────────────────
    linear.x.has_velocity_limits:     true
    linear.x.max_velocity:            10.0    # [m/s]
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration:        1.0    # [m/s²]

    angular.z.has_velocity_limits:     true
    angular.z.max_velocity:            1.5   # [rad/s]
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:        3.0   # [rad/s²]

    # ── Topics ────────────────────────────────────────────────────────────────
    publish_rate: 50.0