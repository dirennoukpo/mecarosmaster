# ─────────────────────────────────────────────────────────────────────────────
#  mecarosmaster_controllers.yaml  —  ROS 2 Humble
#
#  NOMS DE JOINTS — doivent correspondre EXACTEMENT à l'URDF yahboomcar_X3 :
#    front_left_joint   front_right_joint
#    back_left_joint    back_right_joint
#
#  CAUSE DU BUG "cannot be empty" :
#    1) L'ancien YAML utilisait wheel_fl_joint etc. → absents de l'URDF réel
#    2) La clé YAML doit être *_command_joint_name (API Humble, pas Galactic)
# ─────────────────────────────────────────────────────────────────────────────

controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

# ─────────────────────────────────────────────────────────────────────────────
joint_state_broadcaster:
  ros__parameters: {}

# ─────────────────────────────────────────────────────────────────────────────
mecanum_drive_controller:
  ros__parameters:
    # ── Noms des joints (DOIVENT correspondre au bloc <ros2_control> du xacro) ─
    front_left_wheel_command_joint_name:  front_left_joint
    front_right_wheel_command_joint_name: front_right_joint
    rear_left_wheel_command_joint_name:   back_left_joint
    rear_right_wheel_command_joint_name:  back_right_joint

    front_left_wheel_state_joint_name:    front_left_joint
    front_right_wheel_state_joint_name:   front_right_joint
    rear_left_wheel_state_joint_name:     back_left_joint
    rear_right_wheel_state_joint_name:    back_right_joint

    # ── Géométrie réelle Yahboom X3 (depuis l'URDF) ──────────────────────────
    # front_left  : x= 0.08,  y= 0.084492
    # front_right : x= 0.08,  y=-0.0845
    # back_left   : x=-0.08,  y= 0.084492
    # back_right  : x=-0.08,  y=-0.0845
    # → wheel_separation_x = 0.08 + 0.08 = 0.16 m
    # → wheel_separation_y = 0.084492 + 0.0845 ≈ 0.169 m
    wheel_radius:           0.045
    wheel_separation_x:     0.16
    wheel_separation_y:     0.169

    # ── Topics ────────────────────────────────────────────────────────────────
    reference_topic:          "cmd_vel"
    odom_topic:               "odom"
    tf_frame_prefix_enable:   false

    # ── Odométrie ─────────────────────────────────────────────────────────────
    open_loop:                false
    enable_odom_tf:           true
    odom_frame_id:            "odom"
    base_frame_id:            "base_link"
    pose_covariance_diagonal:  [0.01, 0.01, 1.0e6, 1.0e6, 1.0e6, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e6, 1.0e6, 1.0e6, 0.001]

    # ── Limites de vitesse et d'accélération ──────────────────────────────────
    linear.x.has_velocity_limits:      true
    linear.x.max_velocity:             0.5
    linear.x.has_acceleration_limits:  true
    linear.x.max_acceleration:         1.0

    linear.y.has_velocity_limits:      true
    linear.y.max_velocity:             0.5
    linear.y.has_acceleration_limits:  true
    linear.y.max_acceleration:         1.0

    angular.z.has_velocity_limits:     true
    angular.z.max_velocity:            2.0
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration:        4.0

    publish_rate: 50.0