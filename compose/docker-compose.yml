version: "3.9"

services:
  mecarosmaster:
    build:
      context: ./service/mecarosmaster
      dockerfile: Dockerfile
    env_file:
      - ../env/.env
    volumes:
      # Monte ton workspace hôte dans le container
      - ../mecarosmaster_ws:/mecarosmaster_ws
    devices:
      # Ports série dynamiques depuis ton .env
      - "${SERIAL_PORT}:${SERIAL_PORT}"
      # Caméra si besoin
      # - "${CAMERA_PORT}:${CAMERA_PORT}"
    tty: true
    stdin_open: true
